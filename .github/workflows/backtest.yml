# Backtests that need more Open-Meteo calls than the scheduled job can spare
# (keyless; each run is a fresh runner with its own quota of 5,000 calls an
# hour and 10,000 a day). Manual only: a run takes ~95 of the 2,000 free
# private Actions minutes a month. Results are printed and kept as an
# artifact; the numbers go into docs/models.md and the in-app methodology.
name: backtest

on:
  workflow_dispatch:

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # ~7,400 Open-Meteo calls wait out the 5,000/hour limit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Smoke path of a fire vs ERA5
        working-directory: pipeline
        run: |
          uv sync --locked --no-dev
          uv run --no-dev python scripts/backtest_smoke_path.py --winds winds.npz --out backtest_smoke_path.json
      - name: Smoke model vs MODIS AOD
        working-directory: pipeline
        run: uv run --no-dev python scripts/backtest_smoke_model.py --winds winds.npz --out backtest_smoke_model.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-smoke
          path: pipeline/backtest_smoke_*.json
